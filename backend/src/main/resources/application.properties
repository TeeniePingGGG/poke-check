server.port=8080
# 비밀 값(JWT 키, DB 비밀번호)은 application-secret.properties에서 불러옵니다 (Git에 올라가지 않음)
spring.config.import=optional:classpath:application-secret.properties

# JWT
jwt.expiration=86400000

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/pokecheck?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
